services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports:
      - "5433:5432"
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      APP_ENV: local
      APP_SECRET_KEY: local-development-secret-change-me
      DATABASE_URL: postgresql+asyncpg://crm:crm@postgres:5432/crm
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml:ro
    command: sh -c "alembic upgrade head && python -m scripts.seed && uvicorn crm.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  crm_postgres_data:
